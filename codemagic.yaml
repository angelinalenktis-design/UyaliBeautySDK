workflows:
  ios-check:
    name: Проверка iOS-проекта
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Download project
        script: |
          pip3 install gdown
          gdown "https://drive.google.com/uc?id=1UYlL-CFBe3RPC04Jip6X290s22bk_wWk" -O project.zip
      - name: Extract and inspect project
        script: |
          python3 -c 'import zipfile; zipfile.ZipFile("project.zip").extractall("source")'
          find source -name "*.xcodeproj" -o -name "*.xcworkspace"
          find source -name "Package.swift"