
workflows:
  ios-check:
    name: Сборка iOS-приложения
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      ios_signing:
        certificates:
          - UyaliBeautyCertificate
        provisioning_profiles:
          - UyaliBeautyCertificate

    scripts:
      - name: Download and extract project
        script: |
          set -e
          pip3 install gdown
          gdown "https://drive.google.com/uc?id=1UYlL-CFBe3RPC04Jip6X290s22bk_wWk" -O project.zip
          python3 -c 'import zipfile; zipfile.ZipFile("project.zip").extractall("source")'

      - name: Set up signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          PROJECT=$(find source -name "*.xcodeproj" -print -quit)
          xcode-project build-ipa \
            --project "$PROJECT" \
            --scheme UyaliBeautySDKDemo

    artifacts:
      - build/ios/ipa/*.ipa
