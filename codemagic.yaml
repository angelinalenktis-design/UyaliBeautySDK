workflows:
  ios-check:
    name: Проверка iOS-проекта
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Download and inspect project
        script: |
          set -e
          pip3 install gdown
          gdown "https://drive.google.com/uc?id=1UYlL-CFBe3RPC04Jip6X290s22bk_wWk" -O project.zip
          python3 -c 'import zipfile; zipfile.ZipFile("project.zip").extractall("source")'
          PROJECT=$(find source -name "*.xcodeproj" -print -quit)
          echo "PROJECT: $PROJECT"
          xcodebuild -list -project "$PROJECT"